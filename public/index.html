<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Code Tester</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f5f5f5;
    --text: #1a1a1a;
    --muted: #666;
    --border: #ddd;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 18px; }
  .controls { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  #btn-restore {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 20;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  #btn-restore[hidden] { display: none; }
  button {
    padding: 8px 12px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { background: #eee; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  #viewport-wrap {
    flex: 1;
    position: relative;
    background: #000;
    overflow: hidden;
  }
  #viewport-wrap[hidden] { display: none; }
  #viewport-wrap.maximized {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 10;
  }
  #viewport-wrap > div {
    width: 100%;
    height: 100%;
  }
  #proxy-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #proxy-wrap[hidden] { display: none; }
  #proxy-bar {
    display: flex;
    gap: 8px;
    padding: 8px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  #proxy-bar[hidden] { display: none; }
  #btn-show-bar {
    position: fixed;
    top: 8px;
    right: 8px;
    z-index: 30;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  #btn-show-bar[hidden] { display: none; }
  #proxy-url {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  #proxy-view {
    flex: 1;
    border: 0;
    width: 100%;
    background: #fff;
  }
  #status {
    padding: 8px 16px;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
</style>
</head>
<body>
<header>
  <h1>Academic Code Tester</h1>
  <div class="controls">
    <button id="btn-connect" class="primary">Connect</button>
    <button id="btn-disconnect">Disconnect</button>
    <button id="btn-maximize">Maximize to tab</button>
    <button id="btn-fullscreen">Fullscreen</button>
    <button id="btn-mode">Proxy mode</button>
  </div>
</header>
<div id="viewport-wrap">
</div>
<div id="proxy-wrap" hidden>
  <div id="proxy-bar">
    <input id="proxy-url" type="text" placeholder="https://example.com" spellcheck="false" autocomplete="off">
    <button id="btn-go" class="primary">Go</button>
    <button id="btn-hide-bar" title="Hide address bar">▲</button>
  </div>
  <button id="btn-show-bar" hidden title="Show address bar">▼</button>
  <iframe id="proxy-view" title="Proxied page"
          sandbox="allow-scripts allow-forms allow-downloads allow-popups allow-same-origin"></iframe>
</div>
<div id="status">Disconnected. Click Connect to start.</div>
<button id="btn-restore" hidden>Restore</button>

<script type="module">
  import RFB from './novnc/core/rfb.js';
  const PROXY_TOKEN = "__PROXY_TOKEN__";
  const viewportWrap = document.getElementById('viewport-wrap');
  const proxyWrap = document.getElementById('proxy-wrap');
  const proxyBar = document.getElementById('proxy-bar');
  const proxyUrl = document.getElementById('proxy-url');
  const proxyView = document.getElementById('proxy-view');
  const statusEl = document.getElementById('status');
  const btnConnect = document.getElementById('btn-connect');
  const btnDisconnect = document.getElementById('btn-disconnect');
  const btnMaximize = document.getElementById('btn-maximize');
  const btnFullscreen = document.getElementById('btn-fullscreen');
  const btnMode = document.getElementById('btn-mode');
  const btnRestore = document.getElementById('btn-restore');
  let rfb = null;
  let proxyMode = false;
  function setStatus(msg) { statusEl.textContent = msg; }
  function connect() {
    if (rfb) { rfb.disconnect(); rfb = null; }
    const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
    const url = `${protocol}://${location.host}/websockify`;
    setStatus('Connecting to ' + url + ' ...');
    try {
      rfb = new RFB(viewportWrap, url, { credentials: {} });
      rfb.addEventListener('connect', () => setStatus('Connected.'));
      rfb.addEventListener('disconnect', (e) => setStatus('Disconnected.' + (e.detail.clean ? '' : ' (unclean)')));
      rfb.addEventListener('credentialsrequired', () => setStatus('Credentials required (server is nopw, check proxy).'));
      rfb.scaleViewport = true;
      rfb.resizeSession = false;
    } catch (err) {
      setStatus('Failed to connect: ' + err.message);
    }
  }
  btnConnect.onclick = connect;
  btnDisconnect.onclick = () => { if (rfb) rfb.disconnect(); };
  function setMaximized(on) {
    viewportWrap.classList.toggle('maximized', on);
    btnRestore.hidden = !on;
    btnMaximize.textContent = on ? 'Restore' : 'Maximize to tab';
    if (rfb) { rfb.scaleViewport = true; }
    window.dispatchEvent(new Event('resize'));
  }
  btnMaximize.onclick = () => setMaximized(!viewportWrap.classList.contains('maximized'));
  btnRestore.onclick = () => setMaximized(false);
  btnFullscreen.onclick = () => {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      const el = proxyMode ? proxyWrap : viewportWrap;
      el.requestFullscreen().catch((err) => setStatus('Fullscreen failed: ' + err.message));
    }
  };
  document.addEventListener('fullscreenchange', () => {
    btnFullscreen.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
  });
  function setMode(proxy) {
    proxyMode = proxy;
    setMaximized(false);
    viewportWrap.hidden = proxy;
    proxyWrap.hidden = !proxy;
    btnMode.textContent = proxy ? 'VNC mode' : 'Proxy mode';
    btnMode.classList.toggle('active', proxy);
    for (const b of [btnConnect, btnDisconnect, btnMaximize]) {
      b.style.display = proxy ? 'none' : '';
    }
    setStatus(proxy
      ? 'Proxy mode: pages are fetched through the cloud server but rendered locally in your browser. Downloads go to your computer.'
      : 'Disconnected. Click Connect to start.');
  }
  btnMode.onclick = () => setMode(!proxyMode);
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error('failed to load ' + src));
      document.head.appendChild(s);
    });
  }
  let sjInit = null;
  function ensureScramjet() {
    if (sjInit) return sjInit;
    sjInit = (async () => {
      const base = '/sj/' + encodeURIComponent(PROXY_TOKEN);
      await loadScript(base + '/scram/scramjet.all.js');
      await loadScript(base + '/baremux/index.js');
      const { ScramjetController } = $scramjetLoadController();
      const scramjet = new ScramjetController({
        prefix: base + '/',
        files: {
          wasm: base + '/scram/scramjet.wasm.wasm',
          all: base + '/scram/scramjet.all.js',
          sync: base + '/scram/scramjet.sync.js',
        },
      });
      await scramjet.init();
      if (!navigator.serviceWorker) {
        throw new Error('this browser does not support service workers');
      }
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs
        .filter((r) => !r.scope.includes(PROXY_TOKEN))
        .map((r) => r.unregister()));
      const reg = await navigator.serviceWorker.register(base + '/sw.js',
                                                         { scope: base + '/' });
      const worker = reg.installing || reg.waiting || reg.active;
      if (worker && worker.state !== 'activated') {
        await new Promise((resolve, reject) => {
          const to = setTimeout(
            () => reject(new Error('service worker activation timed out')),
            20000);
          worker.addEventListener('statechange', () => {
            if (worker.state === 'activated') {
              clearTimeout(to);
              resolve();
            } else if (worker.state === 'redundant') {
              clearTimeout(to);
              reject(new Error('service worker became redundant'));
            }
          });
        });
      }
      const connection = new BareMux.BareMuxConnection(
        base + '/baremux/worker.js');
      const wispUrl = (location.protocol === 'https:' ? 'wss' : 'ws') +
        '://' + location.host + base + '/wisp/';
      if ((await connection.getTransport()) !== base + '/epoxy/index.mjs') {
        await connection.setTransport(base + '/epoxy/index.mjs',
                                      [{ wisp: wispUrl }]);
      }
      const frame = scramjet.createFrame(proxyView);
      frame.addEventListener('urlchange', (e) => {
        if (e && e.url) proxyUrl.value = e.url;
      });
      return frame;
    })();
    return sjInit;
  }
  function classicProxyGo(u) {
    proxyView.src = '/proxy?url=' + encodeURIComponent(u) +
      '&token=' + encodeURIComponent(PROXY_TOKEN);
    setStatus('Proxied page loaded (classic fallback, rendered locally).');
  }
  async function proxyGo() {
    let u = proxyUrl.value.trim();
    if (!u) return;
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    setStatus('Starting proxy...');
    try {
      const frame = await ensureScramjet();
      setStatus('Loading proxied page...');
      frame.go(u);
    } catch (err) {
      setStatus('Proxy init failed (' + err.message +
                '), falling back to classic proxy.');
      sjInit = null;
      classicProxyGo(u);
    }
  }
  document.getElementById('btn-go').onclick = proxyGo;
  proxyUrl.addEventListener('keydown', (e) => { if (e.key === 'Enter') proxyGo(); });
  const btnHideBar = document.getElementById('btn-hide-bar');
  const btnShowBar = document.getElementById('btn-show-bar');
  btnHideBar.onclick = () => {
    proxyBar.hidden = true;
    btnShowBar.hidden = false;
  };
  btnShowBar.onclick = () => {
    proxyBar.hidden = false;
    btnShowBar.hidden = true;
  };
  proxyView.addEventListener('load', () => {
    if (proxyMode) setStatus('Proxied page loaded (rendered locally).');
  });
</script>
</body>
</html>
